modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/foliarn/music-unbound/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/foliarn/music-unbound"
authors="foliarn"
logoFile="musicunbound.png"
description='''
Client-side music manager: every song can play anywhere, presets from Alpha to today, and the newest tracks backported to 1.21.1.
'''

[[mixins]]
config="${mod_id}.mixins.json"

# Client-only: dependencies are only enforced on the client.
[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"
